# Generated by the public release publisher. Source snapshots originate in GitLab.
name: Public source checks and npm release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run check:package
  publish:
    name: Publish npm package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p = JSON.parse(readFileSync('package.json','utf8'));
          assert.equal(p.name,'@basaltic-sh/sdk-js');
          assert.equal('v'+p.version,process.env.GITHUB_REF_NAME);
          assert.equal(p.repository.url,'git+https://github.com/basaltic-sh/sdk-js.git');
          JS
          git diff --exit-code
      - name: Publish with provenance
        env:
          # One-time staging creates the package before npm permits OIDC setup.
          # Remove the bootstrap secret and variable once trusted publishing works.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          BOOTSTRAP_STAGE: ${{ vars.NPM_BOOTSTRAP_STAGE }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          if [ "$BOOTSTRAP_STAGE" = true ]; then
            npm stage publish --ignore-scripts --access public --provenance --tag "$DIST_TAG"
          else
            npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG"
          fi
